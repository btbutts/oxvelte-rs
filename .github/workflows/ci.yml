name: CI

on:
  push:
    branches: [main, programatic-deps-updates]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    env:
      OXVELTE_COMPILER_RUNTIME: ${{ github.workspace }}/scripts/compiler-runtime
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        shell: bash
        run: |
          (cd scripts/compiler-runtime && bun install --ignore-scripts)
          (cd scripts/get-fixtures && bun install --ignore-scripts)

      # The pinned upstream fixture trees are not tracked in git (see
      # docs/research/test/pinned-rules.md); fetch them before anything that
      # reads them. The launcher prefers bun, so import.mjs runs under bun.
      # All multi-command steps use bash everywhere: the Windows default
      # (pwsh) does not stop on native command failures, which would mask a
      # failing middle command behind a passing last one.
      - name: Fetch pinned upstream fixtures
        shell: bash
        run: |
          cargo get-svelte-fixtures
          cargo get-eslint-fixtures

      - name: Run JS test suites
        shell: bash
        run: |
          (cd scripts/get-fixtures && bun test)
          (cd scripts/compiler-runtime && bun test)
          bun test tests/compiler-configuration.test.mjs
          bun test scripts/summarize-parity.test.mjs
          bun test scripts/version-matrix/run.test.mjs

      - name: Run Rust test suites
        shell: bash
        run: |
          cargo test --lib
          cargo test --test parser_lint_contract
          cargo test --locked --test upstream_adapter
          cargo test --locked --test jobsys_regressions
          cargo test --locked --test upstream_parity -- --report reports/upstream-parity.json

      # Sequential profiles: the parity test binary is compiled once above
      # and reused by every profile, so this adds no compilation cost.
      - name: Run upstream version matrix
        shell: bash
        run: |
          for profile in modern svelte4 legacyparser svelte3; do
            bun scripts/version-matrix/run.mjs --profile "$profile"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            reports/upstream-parity.json
            reports/version-matrix/
