name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OXVELTE_COMPILER_RUNTIME: ${{ github.workspace }}/scripts/compiler-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: scripts/compiler-runtime
      # The pinned upstream fixture trees are not tracked in git (see
      # docs/research/test/pinned-rules.md); fetch them before testing.
      - run: cargo get-svelte-fixtures
      - run: cargo get-eslint-fixtures
      - run: cargo test --lib
      - run: cargo test --test parser_lint_contract
      - run: cargo build --release

  upstream-parity:
    env:
      OXVELTE_COMPILER_RUNTIME: ${{ github.workspace }}/scripts/compiler-runtime
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: scripts/get-fixtures
      - run: npm test
        working-directory: scripts/get-fixtures
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: scripts/compiler-runtime
      - run: npm test
        working-directory: scripts/compiler-runtime
      - run: node --test tests/compiler-configuration.test.mjs
      - run: node --test scripts/summarize-parity.test.mjs
      # The pinned upstream fixture trees are not tracked in git; fetch them
      # before running the parity suites.
      - run: cargo get-svelte-fixtures
      - run: cargo get-eslint-fixtures
      - run: cargo test --locked --test upstream_adapter
      - run: cargo test --locked --test jobsys_regressions
      - run: cargo test --locked --test upstream_parity -- --report reports/upstream-parity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-parity-${{ matrix.os }}
          path: reports/upstream-parity.json


  upstream-version-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        profile: [modern, svelte4, legacyparser, svelte3]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: scripts/get-fixtures
      - run: node --test scripts/version-matrix/run.test.mjs
      # The pinned upstream fixture trees are not tracked in git; fetch them
      # before running the version matrix.
      - run: cargo get-svelte-fixtures
      - run: cargo get-eslint-fixtures
      - run: node scripts/version-matrix/run.mjs --profile ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-matrix-${{ matrix.profile }}-${{ matrix.os }}
          path: |
            reports/version-matrix/${{ matrix.profile }}/parity.json
            reports/version-matrix/summary-${{ matrix.profile }}.json
