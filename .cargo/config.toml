# Project-local cargo configuration.

# Point the compiler bridge (scripts/compiler-runtime/bridge.cjs) at the
# runtime directory that dev-setup.sh installs, so the compiler fixture tests
# can resolve svelte/compiler no matter which fixture directory a test file
# lives in — the same thing ci.yml sets explicitly for its test job. An
# OXVELTE_COMPILER_RUNTIME already present in the environment takes
# precedence over this value (cargo does not override existing variables
# unless `force` is set), so CI and ad-hoc overrides still win.
[env]
OXVELTE_COMPILER_RUNTIME = { value = "scripts/compiler-runtime", relative = true }

# Pinned upstream snapshots for build.rs's CSS property list generation
# (see docs/research/css/property-awareness-lib.md). Bump a hash to pull a
# newer snapshot of that source, then delete
# resources/css/known_css_properties.json to regenerate on the next build.
# Hashes below are each repo's HEAD as of 23OCT2026.
OXVELTE_CSS_SRC_KNOWN_CSS_PROPERTIES_COMMIT = "d8007804a12fa5431a2d8e3b55252052442e51d0"
OXVELTE_CSS_SRC_MDN_BROWSER_COMPAT_DATA_COMMIT = "6ced300dbd4cb9dbca68b2c2dffb8627d2aac82f"
OXVELTE_CSS_SRC_CSSTREE_COMMIT = "f8980154f79110833bf56c391cd45fe5f9205752"
OXVELTE_CSS_SRC_MDN_DATA_COMMIT = "fc60c55f5018ea399516a84ea2c64adf7731da82"
OXVELTE_CSS_SRC_WEBKIT_COMMIT = "21bb1f66c37c7a8380cf7597d647eecb87f55ebd"
OXVELTE_CSS_SRC_W3C_WEBREF_COMMIT = "64111c5ac4fccf60f45bc266a322ea3fad8098f4"

# When "true", build.rs also reports per-source fetch/dedup stats and the
# final property count as cargo warnings while generating the CSS property
# list. When "false" (default), only genuine failures are warned about.
OXVELTE_BUILD_SHOW_CSS_PROP_GEN_STATS = "false"

# Pinned upstream release tags for the fixture importers (see
# docs/research/test/pinned-rules.md). Bump a version to pull a newer
# fixture set, then run the matching alias: `cargo get-svelte-fixtures`
# refreshes fixtures/parser/ from sveltejs/svelte, `cargo get-eslint-fixtures`
# refreshes fixtures/linter/ from sveltejs/eslint-plugin-svelte.
OXVELTE_FIXTURES_ESLINT_PLUGIN_SVELTE_TAG = "3.23.1"
OXVELTE_FIXTURES_SVELTE_TAG = "5.57.3"

# The parity environment's svelte/typescript versions, written into
# fixtures/linter/package.json and the node_modules/typescript version marker
# by `cargo get-eslint-fixtures`. Bump here rather than editing import.mjs.
OXVELTE_FIXTURES_SVELTE_VERSION = "5.49.2"
OXVELTE_FIXTURES_TYPESCRIPT_VERSION = "6.0.3"

# Optional JavaScript runtime override for the fixture importer launcher:
# "bun" or "node". Unset = auto-detect (bun preferred, node fallback).
# OXVELTE_JS_RUNTIME = "node"

[alias]
get-eslint-fixtures = "run --bin launcher -- --get-eslint-fixtures"
get-svelte-fixtures = "run --bin launcher -- --get-svelte-fixtures"
