[package]
name = "oxvelte"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A fast Svelte linter written in Rust — drop-in replacement for eslint-plugin-svelte, 4-25x faster"
keywords = ["svelte", "linter", "lint", "eslint", "oxc"]
categories = ["development-tools", "command-line-utilities"]
build = "build.rs"

[workspace]
members = [".", "crates/oxvelte_*"]
resolver = "2"

# The version literal lives here and only here: every workspace member
# (including the root package) inherits it, and scripts/release.sh reads
# and rewrites it scoped to this section.
[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/billpeet/oxvelte"
homepage = "https://github.com/billpeet/oxvelte"

# Single point of truth for dependency versions. Members inherit with
# `dep = { workspace = true }`; the oxc pins must keep their exact
# `=0.156.0` form — parser/linter parity depends on it.
[workspace.dependencies]
oxc = { version = "=0.156.0", features = ["full", "serialize"] }
oxc_diagnostics = "=0.156.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6.7", features = ["derive"] }
thiserror = "2"
rustc-hash = "2"
rayon = "1"
atty = "0.2"
regex = "1"
boa_engine = "0.22.0"
selectors = "0.41.0"
precomputed-hash = "0.1.1"
cssparser = "0.38.0"
notify = "8.2.1"

[lib]
name = "oxvelte"
path = "src/lib.rs"

[[bin]]
name = "oxvelte"
path = "src/main.rs"

# Thin launcher behind the `cargo get-eslint-fixtures` / `cargo
# get-svelte-fixtures` aliases (see .cargo/config.toml and
# docs/research/test/pinned-rules.md). Not part of the shipped linter.
[[bin]]
name = "launcher"
path = "scripts/launcher.rs"

[features]
default = []
custom-rules = ["dep:boa_engine"]
tsrs-inference = []

[dependencies]
oxc.workspace = true
oxc_diagnostics.workspace = true
oxvelte_compiler = { path = "crates/oxvelte_compiler" }
oxvelte_parser = { path = "crates/oxvelte_parser" }
oxvelte_transport = { path = "crates/oxvelte_transport" }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
miette = { version = "7", features = ["fancy"] }
thiserror.workspace = true
rustc-hash.workspace = true
rayon.workspace = true
atty.workspace = true
regex.workspace = true
boa_engine = { workspace = true, optional = true }
selectors.workspace = true
precomputed-hash.workspace = true
cssparser.workspace = true
notify.workspace = true

[dev-dependencies]
oxvelte = { path = ".", features = ["tsrs-inference", "custom-rules"] }
insta = { version = "1.49.0", features = ["json"] }
sha2 = "0.11.1"

[[test]]
name = "upstream_parity"
path = "tests/upstream_parity.rs"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
incremental = true
debug-assertions = false

[profile.dev]
opt-level = 3
lto = "thin"
codegen-units = 32
debug = true
incremental = true
debug-assertions = true

[build-dependencies]
flate2 = "1.1.10"
serde_json = "1"
tar = "0.4.46"
ureq = "3.5.0"
zip = { version = "^9", default-features = false, features = ["deflate"] }
