[package]
name = "oxvelte"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "A fast Svelte linter written in Rust — drop-in replacement for eslint-plugin-svelte, 4-25x faster"
repository = "https://github.com/billpeet/oxvelte"
homepage = "https://github.com/billpeet/oxvelte"
keywords = ["svelte", "linter", "lint", "eslint", "oxc"]
categories = ["development-tools", "command-line-utilities"]
build = "build.rs"

[lib]
name = "oxvelte"
path = "src/lib.rs"

[[bin]]
name = "oxvelte"
path = "src/main.rs"

# Thin launcher behind the `cargo get-eslint-fixtures` / `cargo
# get-svelte-fixtures` aliases (see .cargo/config.toml and
# docs/research/test/pinned-rules.md). Not part of the shipped linter.
[[bin]]
name = "launcher"
path = "scripts/launcher.rs"

[features]
default = []
custom-rules = ["dep:boa_engine"]

[dependencies]
oxc = { version = "=0.156.0", features = ["full", "serialize"] }
oxc_diagnostics = "=0.156.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
rustc-hash = "2"
rayon = "1"
atty = "0.2"
regex = "1"
boa_engine = { version = "0.22.0", optional = true }
selectors = "0.41.0"
precomputed-hash = "0.1.1"
cssparser = "0.38.0"
notify = "8.2.1"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
sha2 = "0.10"
serde_yaml = "0.9"

[[test]]
name = "upstream_parity"
path = "tests/upstream_parity.rs"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
incremental = true
debug-assertions = false

[profile.dev]
opt-level = 3
lto = "thin"
codegen-units = 32
debug = true
incremental = true
debug-assertions = true

[build-dependencies]
flate2 = "1.1.10"
serde_json = "1"
tar = "0.4.46"
ureq = "3.5.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
