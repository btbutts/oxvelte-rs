[package]
name = "oxvelte_linter"
description = "Lint rule engine and rule implementations for oxvelte (Svelte linter)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
workspace = "../.."

[features]
tsrs-inference = ["dep:oxvelte_tsrs"]

[dependencies]
oxc.workspace = true
oxvelte_compiler = { path = "../oxvelte_compiler" }
oxvelte_parser = { path = "../oxvelte_parser" }
oxvelte_transport = { path = "../oxvelte_transport" }
oxvelte_tsrs = { path = "../oxvelte_tsrs", optional = true }
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
rustc-hash.workspace = true
selectors.workspace = true
cssparser.workspace = true
precomputed-hash.workspace = true

[build-dependencies]
flate2 = "1.1.10"
serde_json = "1"
tar = "0.4.46"
ureq = "3.5.1"
zip = { version = "^9", default-features = false, features = ["deflate"] }
